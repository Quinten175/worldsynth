# Written by the WorldSynth GUI.
cad: {dir: /home/minorar/worldsynth/assets/joke, cache_dir: /home/minorar/worldsynth/cache/usd, units: auto, class_from: file,
  tessellation_lod: 2}
output: {dir: /home/minorar/worldsynth/output, seed: 0, overwrite: false}
dataset:
  num_clips: 10
  frames_per_clip: 1
  fps: 20
  resolution: [1248, 720]
  renderer: realtime
  antialiasing: DLAA
  path_tracing_spp: 64
  rt_subframes: 8
  warmup_frames: 4
  annotations: [depth, segmentation]
  min_visible_fraction: 0.05
  coco_segmentation: rle
scene:
  scene_usd: /home/minorar/VLA_Project/vdl_env.usd
  scene_surface: /World/Gitterbox
  placement_z: 0.057
  surface_margin: 0.03
  scene_camera: /World/pallet_camera
  scene_parts: null
  scene_parts_mode: place
  placement_in_view: true
  scene_lights_only: false
  table:
    size: [1.2, 0.8, 0.75]
  walls: true
  parts_per_clip: [15, 17]
  max_instances_per_class: 40
  placement_area:
  - [-0.3, 0.3]
  - [-0.2, 0.2]
  pose_mode: upright
  min_spacing: 0.015
  min_distance: 0.0
  yaw_range: [65.0, 115.0]
  pitch_range: [-3.0, 3.0]
  roll_range: [-3.0, 3.0]
  line_mode: false
  line_axis: x
  line_jitter: 0.015
  pile_mode: true
  pile_max_height: 0.85
  pile_layers: 3
  physics_settle: true
  physics_steps: 240
randomization:
  lighting:
    dome_intensity: [200, 1200]
    dome_color_temperature: [4000, 7500]
    num_lights: [1, 3]
    light_intensity: [3000, 25000]
    light_color_temperature: [3000, 6500]
    light_height: [1.6, 2.6]
    light_size: [0.2, 1.2]
  part_material:
    randomize_prob: 0.8
    metal_prob: 0.6
    metal_roughness: [0.15, 0.55]
    paint_roughness: [0.3, 0.9]
  clutter:
    enabled: false
    count: [0, 8]
    size: [0.02, 0.12]
    margin: 0.1
  surface_roughness: [0.3, 0.95]
camera:
  distance: [0.45, 0.9]
  elevation: [35, 75]
  azimuth: [-70, 70]
  azimuth_sweep: [-5.0, 5.0]
  elevation_sweep: [-5.0, 5.0]
  distance_sweep: [0, 0]
  focal_length: [18, 35]
  target_jitter: 0.08
